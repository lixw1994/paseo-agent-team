schema: spec-driven-with-adr

context: |
  Language: English
  All artifacts must be written in English.
  The primary agent is Tech Lead and owns architecture, core implementation,
  and all OpenSpec/ADR artifacts. Helpers are Researcher (external information),
  Writer (docs/ only), and Worker (simple bounded chores). Collaboration
  requires an explicit user request; use the optional Paseo Agent Team plugin
  or native Paseo tools (see AGENTS.md). Durable ADRs live at <repo>/adr/ and are immutable once accepted.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
